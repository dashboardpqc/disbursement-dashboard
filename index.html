<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disbursement Dashboard</title>
<style>
:root{
  color-scheme:light;
  --page:#eef2fb; --surface:#ffffff; --glass:rgba(255,255,255,.66); --glass-solid:rgba(255,255,255,.92); --glass-bd:rgba(255,255,255,.85); --glass-sh:0 10px 34px rgba(40,60,120,.10),0 1px 2px rgba(40,60,120,.06); --gloss:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 55%); --bg:radial-gradient(900px 520px at 8% -8%,#cfe0ff 0%,transparent 60%),radial-gradient(800px 520px at 100% 0%,#ffd9c2 0%,transparent 55%),radial-gradient(900px 600px at 60% 105%,#dccbff 0%,transparent 60%),#f3f6fd; --ink:#191919; --ink2:#666666; --ink3:#8a8a8a;
  --grid:rgba(60,70,100,.10); --axis:rgba(60,70,100,.25); --border:rgba(60,70,110,.12); --hover:rgba(60,80,140,.07);
  --new:#257de0; --ren:#f47230; --neutral:#c9ccd1; --accent:#0a74e8; --accent-soft:rgba(10,132,255,.13);
  --good:#0aac23; --good-ink:#006c10; --warn:#fbb315; --warn-ink:#8a5a00; --crit:#dc3c3d; --crit-ink:#b42324;
  --shadow:var(--glass-sh);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0b0b0b; --surface:#1c1c1f; --glass:rgba(40,40,46,.62); --glass-solid:rgba(34,34,38,.94); --glass-bd:rgba(255,255,255,.10); --glass-sh:0 10px 34px rgba(0,0,0,.4); --gloss:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 55%); --bg:radial-gradient(900px 520px at 8% -8%,#1a2a4a 0%,transparent 60%),radial-gradient(800px 520px at 100% 0%,#3a2218 0%,transparent 55%),#0b0b0d; --ink:#efefef; --ink2:#9c9c9c; --ink3:#7a7a7a;
  --grid:#303030; --axis:#474747; --border:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06);
  --new:#338ced; --ren:#e76624; --neutral:#4a4d52; --accent:#6aabf1; --accent-soft:#16263a;
  --good:#0aac23; --good-ink:#53c556; --warn:#fbb315; --warn-ink:#fbb315; --crit:#dc3c3d; --crit-ink:#f06a6b;
  --shadow:var(--glass-sh);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-attachment:fixed;min-height:100vh;color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:16px;padding:14px 20px;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{display:block}
.brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.brand p{margin:0;color:var(--ink2);font-size:12.5px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink2);background:var(--surface)}
.pill b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.pill.live .dot{background:var(--good)} .pill.err .dot{background:var(--crit)} .pill.demo .dot{background:var(--warn)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.btn:hover{background:var(--hover)}
.btn:focus-visible,.seg button:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible,th[data-sort]:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
/* tabs & filters */
nav.tabs{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.tabs-in{display:flex;gap:4px;padding:0 20px;max-width:1320px;margin:0 auto;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;cursor:pointer;color:var(--ink2);font-weight:550;white-space:nowrap}
.tab:hover{color:var(--ink)} .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:14px 0 4px}
.filters label{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;color:var(--ink2);font-size:13px;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
select,input[type=search]{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:32px}
input[type=search]{min-width:200px}
.note{color:var(--ink2);font-size:12.5px}
/* layout */
main{padding:6px 0 40px}
.banner{margin:14px auto 0;max-width:1280px;border:1px solid var(--border);border-left:4px solid var(--warn);background:var(--surface);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.err{border-left-color:var(--crit)}
.banner span{flex:1;min-width:220px}
.grid{display:grid;gap:14px;margin-top:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0;font-size:15px;font-weight:650}
.card .sub{color:var(--ink2);font-size:12.5px;margin-top:2px}
.card-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.card-h .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{color:var(--ink2);font-size:12.5px;display:flex;align-items:center;gap:7px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
.kpi .s{color:var(--ink2);font-size:12.5px}
.key{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle}
.key.box{height:10px;width:10px;border-radius:2px}
.up{color:var(--good-ink)} .down{color:var(--crit-ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink2);font-size:12.5px;margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink2);font-size:11.5px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--axis);stroke-width:1}
.chart .ref{stroke:var(--ink2);stroke-width:1.25;stroke-dasharray:5 4}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:focus{outline:none}
.chart .hl{fill:var(--hover);opacity:0;pointer-events:none}
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:170px;font-size:12.5px;display:none}
.tip .tt{font-weight:650;margin-bottom:5px}
.tip .tr{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip .tr .key{flex:none} .tip .tr strong{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.tip .tr span.n{color:var(--ink2)}
.tip .tf{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
/* tables */
.tw{overflow:auto;max-height:78vh;border:1px solid var(--border);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{position:sticky;top:0;background:var(--surface);color:var(--ink2);font-weight:600;font-size:12px;z-index:2;border-bottom:1px solid var(--axis)}
th.l,td.l{text-align:left}
th[data-sort]{cursor:pointer;user-select:none} th[data-sort]:hover{color:var(--ink)}
th .ar{opacity:.5;font-size:10px;margin-left:3px}
tbody tr:hover td{background:var(--hover)}
tr[data-i]{cursor:pointer}
tfoot td{font-weight:700;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--axis);border-bottom:0}
td .sm{display:block;color:var(--ink2);font-size:11.5px}
td.zero{color:var(--ink3)}
.bar{display:flex;gap:2px;height:10px;min-width:110px;border-radius:3px;overflow:hidden;background:transparent}
.bar i{display:block;height:100%}
.bar .n{background:var(--new)} .bar .r{background:var(--ren)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid var(--border)}
.chip.good{color:var(--good-ink)} .chip.warn{color:var(--warn-ink)} .chip.crit{color:var(--crit-ink)} .chip.mute{color:var(--ink2);font-weight:500}
.chip.good{background:color-mix(in srgb,var(--good) 12%,transparent)} .chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent)} .chip.crit{background:color-mix(in srgb,var(--crit) 12%,transparent)}
/* horizontal bars */
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:6px 10px;align-items:center}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .nm small{color:var(--ink2);display:block;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.hb .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.hb .trk{height:14px}
.hb .bar{height:14px;border-radius:4px}
.hb .gap{grid-column:1/-1;height:2px}
.team{padding:12px 0;border-top:1px solid var(--grid)} .team:first-of-type{border-top:0;padding-top:4px}
.team .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.team .big{font-size:22px;font-weight:700}
.team .bar{margin:8px 0 6px;height:12px;border-radius:4px}
.facts{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink2);font-size:12.5px}
.facts b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pipe{display:grid;grid-template-columns:150px 1fr auto;gap:8px 10px;align-items:center}
.pipe .trk{height:16px;background:var(--hover);border-radius:4px;overflow:hidden}
.pipe .trk i{display:block;height:100%;border-radius:4px}
.prog{height:8px;background:var(--hover);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:4px;background:var(--new)}
.empty{padding:36px 12px;text-align:center;color:var(--ink2)}
/* drawer & dialog */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.ov.on{display:block}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(640px,100%);background:var(--surface);padding:20px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.drawer h3{margin:0;font-size:18px}
.x{float:right}
.steps{counter-reset:s;padding:0;list-style:none;margin:10px 0}
.steps li{counter-increment:s;margin:10px 0;padding-left:34px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
code{background:var(--hover);padding:1px 6px;border-radius:5px;font-size:12.5px}
.tabstat{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:8px}
footer{color:var(--ink2);font-size:12px;text-align:center;padding:10px 0 30px}
.sr{position:absolute;left:-9999px}
.busy{opacity:.55;transition:opacity .2s}
@media (max-width:640px){
  .kpi .v{font-size:22px} .top-r{margin-left:0} input[type=search]{min-width:0;width:100%}
  .pipe{grid-template-columns:110px 1fr auto}
}
@media print{ nav.tabs,.top-r,.filters,.banner{display:none} body{background:#fff} }

/* ===== iOS glossy glass layer ===== */
header.top{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border-bottom:1px solid var(--glass-bd)}
.logo{border-radius:13px;background:linear-gradient(160deg,#5ab0ff,#0a74e8);box-shadow:0 6px 14px rgba(10,116,232,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.brand h1{font-weight:700;letter-spacing:-.02em;font-size:18px}
nav.tabs{background:transparent;border:0;top:8px;padding:10px 0 2px;pointer-events:none}
.tabs-in{pointer-events:auto;display:flex;width:max-content;max-width:calc(100% - 24px);margin:0 auto;padding:4px;gap:2px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-bd);border-radius:999px;box-shadow:var(--glass-sh)}
.tab{border:0;border-radius:999px;padding:8px 18px;color:var(--ink2);transition:all .18s}
.tab[aria-selected="true"]{background:var(--glass-solid);color:var(--ink);box-shadow:0 2px 8px rgba(30,50,110,.16),inset 0 1px 0 #fff}
.card,.kpi{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--glass-bd);border-radius:26px;box-shadow:var(--glass-sh),inset 0 1px 0 rgba(255,255,255,.85);overflow:hidden}
.card{padding:20px 22px}
.kpi{border-radius:24px;padding:16px 18px}
.card::before,.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:60%;background:var(--gloss);pointer-events:none;border-radius:inherit}
.card>*,.kpi>*{position:relative}
.card h2{font-size:16px;font-weight:700;letter-spacing:-.015em}
.kpi .v{font-weight:750;letter-spacing:-.03em}
.btn{border-radius:999px;padding:7px 15px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glass-bd);box-shadow:0 1px 3px rgba(30,50,110,.10),inset 0 1px 0 rgba(255,255,255,.8)}
.btn.primary{background:linear-gradient(180deg,#4fa8ff,#0a74e8);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:0 6px 16px rgba(10,116,232,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.pill{background:var(--glass);border-color:var(--glass-bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.seg{border:0;border-radius:999px;padding:3px;background:rgba(120,130,160,.16);gap:2px}
.seg button{border:0;border-radius:999px;padding:5px 14px}
.seg button:hover{background:transparent;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--glass-solid);color:var(--ink);font-weight:650;box-shadow:0 2px 6px rgba(30,50,110,.16),inset 0 1px 0 #fff}
select,input[type=search]{border-radius:14px;background:var(--glass);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 2px rgba(30,50,110,.07);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.banner{background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--glass-bd);border-left:1px solid var(--glass-bd);border-radius:22px;box-shadow:var(--glass-sh)}
.banner::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px rgba(251,179,21,.25);flex:none}
.banner.err::before{background:var(--crit);box-shadow:0 0 0 4px rgba(220,60,61,.2)}
.tw{border-radius:18px;border:1px solid var(--glass-bd);background:rgba(255,255,255,.35)}
th{background:var(--glass-solid);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
tfoot td{background:var(--glass-solid)}
tbody tr:hover td{background:rgba(10,132,255,.07)}
.chip{border-radius:999px;border-color:transparent}
.bar{border-radius:999px;gap:2px}
.bar i:first-child{border-radius:999px 0 0 999px}.bar i:last-child{border-radius:0 999px 999px 0}
.hb .bar,.team .bar{border-radius:999px}
.prog,.pipe .trk{border-radius:999px;background:rgba(120,130,160,.18)}
.prog i,.pipe .trk i{border-radius:999px}
.tip{border-radius:16px;background:var(--glass-solid);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-bd);box-shadow:0 14px 40px rgba(30,50,110,.22)}
.chart .hl{rx:10}
.ov{background:rgba(20,30,60,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.drawer{top:10px;bottom:10px;right:10px;border-radius:28px;background:var(--glass-solid);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-bd);box-shadow:0 20px 60px rgba(20,30,70,.3)}
code{border-radius:8px}
footer{color:var(--ink3)}
@media (max-width:640px){.card{padding:16px}.tab{padding:7px 12px}.drawer{top:6px;bottom:6px;right:6px;left:6px;width:auto}}

.chev{display:inline-block;width:18px;color:var(--ink2);font-size:12px}
tr.lv0 td{background:rgba(10,132,255,.13);font-size:13.5px}
tr.lv1 td{background:rgba(10,132,255,.06)}
tr.lv2 td{background:rgba(120,130,160,.07);font-weight:600}
tr.lv2 td b{font-weight:600} tr.lv3 td b{font-weight:500}
tr.lv0:hover td,tr.lv1:hover td,tr.lv2:hover td{background:rgba(10,132,255,.16)}
tr[data-k]{cursor:pointer}
tr[data-k] td .sm{display:inline}

/* ===== parameters page ===== */
.pteam{margin-top:14px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.prow.ph{padding-bottom:8px;border-bottom:1px solid var(--grid)}
.plab{color:var(--ink2);font-size:12px;min-width:0}
.parea{margin:12px 0 4px;padding:12px 12px 6px;border-radius:20px;background:rgba(10,132,255,.06);border:1px solid rgba(10,132,255,.12)}
.pclus{margin:8px 0 6px 10px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid var(--glass-bd)}
.pbr{padding-left:8px}
.pin{border:1px solid var(--glass-bd);background:var(--glass-solid);border-radius:12px;padding:6px 10px;min-height:32px;box-shadow:inset 0 1px 2px rgba(30,50,110,.07);min-width:0}
.pin.w-xs{width:70px}.pin.w-sm{width:110px}.pin.w-md{width:170px}
.pin.bad{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,var(--glass-solid))}
.ptools{margin-left:auto;display:inline-flex;gap:4px}
.ib{border:0;border-radius:999px;min-width:30px;height:30px;padding:0 10px;cursor:pointer;background:rgba(120,130,160,.16);color:var(--ink2)}
.ib:hover{background:rgba(10,132,255,.16);color:var(--ink)} .ib.del:hover{background:rgba(220,60,61,.18);color:var(--crit-ink)}
.btn.sm{padding:4px 12px;font-size:12.5px}
.pact{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.warnbox{margin:0 0 12px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
button.adopt{cursor:pointer;font:inherit}
.pbr .plab{display:none}
.pbr .pin{width:150px}.pbr .pin.w-xs{width:64px}.pbr select.pin{width:130px}
.ptools{flex:none}
.pbr{flex-wrap:wrap}

/* download icons */
.dl{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid var(--glass-bd,var(--border));background:var(--glass,var(--surface));color:var(--accent);cursor:pointer;padding:0;box-shadow:0 1px 3px rgba(30,50,110,.12)}
.dl:hover{background:var(--accent-soft)}
.dl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi>.dl{position:absolute;top:10px;right:12px}
.card-h>.dl.inl{margin-left:auto;align-self:flex-start}
@media print{.dl{display:none}}

/* download icons: hidden until you point at the card, translucent glass look */
.dl{opacity:0;pointer-events:none;transition:opacity .18s ease,background .18s ease,transform .18s ease;transform:scale(.92);background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.7)}

<script>
/* ===== PARSER: turns the CSV text of each Google-Sheet tab into one clean model ===== */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  text = String(text || '').replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c === '\r') { /* skip */ }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const T = (v) => (v == null ? '' : String(v).trim());
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = T(v).replace(/[₹,\s%]|Rs\.?/gi, '');
  if (s === '' || /^#/.test(s)) return 0;
  if (/^\(.*\)$/.test(s)) s = '-' + s.slice(1, -1);
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function rawDate(s) {
  s = T(s); if (!s) return null;
  let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return { y: +m[1], m: +m[2], d: +m[3] };
  if ((m = s.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9})[-\/. ,]*(\d{2,4})?$/)) && MON[m[2].slice(0, 3).toLowerCase()])
    return { y: m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null, m: MON[m[2].slice(0, 3).toLowerCase()], d: +m[1] };
  if ((m = s.match(/^([A-Za-z]{3,9})[-\/. ]+(\d{1,2})(?:st|nd|rd|th)?[, \-\/.]*(\d{2,4})?$/)) && MON[m[1].slice(0, 3).toLowerCase()])
    return { y: m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null, m: MON[m[1].slice(0, 3).toLowerCase()], d: +m[2] };
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/)))
    return { amb: true, a: +m[1], b: +m[2], y: +m[3] < 100 ? 2000 + +m[3] : +m[3] };
  if (/^\d{5}$/.test(s) && +s > 30000 && +s < 70000) { // Excel serial
    const dt = new Date(Date.UTC(1899, 11, 30) + +s * 864e5);
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
  }
  return null;
}
/* Resolve a list of date strings together, so 01/11 vs 11/01 is decided from the whole column of dates. */
function resolveDates(list) {
  const raw = list.map(rawDate);
  const amb = raw.filter(r => r && r.amb);
  let monthFirst = false;
  if (amb.length >= 2) {
    const as = new Set(amb.map(r => r.a)), bs = new Set(amb.map(r => r.b));
    if (as.size === 1 && bs.size > 1) monthFirst = true;        // 11/01, 11/02 ... => month is first
    else if (bs.size === 1 && as.size > 1) monthFirst = false;  // 01/11, 02/11 ... => day is first
    else monthFirst = amb.every(r => r.a <= 12) && !amb.every(r => r.b <= 12);
  }
  const ref = raw.find(r => r && r.y);
  return raw.map(r => {
    if (!r) return null;
    let y = r.y || (ref ? ref.y : new Date().getFullYear()), m, d;
    if (r.amb) { if (monthFirst) { m = r.a; d = r.b; } else { m = r.b; d = r.a; } } else { m = r.m; d = r.d; }
    if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
    return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  });
}
function titleCase(s) {
  s = T(s).replace(/\s+/g, ' ');
  return s.toLowerCase().replace(/(^|[\s\-(\/])([a-z])/g, (x, p, c) => p + c.toUpperCase());
}
function prettyName(s) { // Branch / person names
  s = T(s); if (!s) return '';
  return titleCase(s).replace(/\bAp\b/, 'AP').replace(/\bTg\b/, 'TG');
}
function teamLabel(title) {
  const w = T(title).split(/\s+/)[0] || '';
  return w.length <= 3 ? w.toUpperCase() : titleCase(w);
}
function fillDown(rows, idxs) { // forward-fill merged cells
  const last = {};
  rows.forEach(r => idxs.forEach(i => { if (r[i]) last[i] = r[i]; else r[i] = last[i] || ''; }));
}
const cell = (r, i) => (r && r[i] != null ? r[i] : '');

/* ---------- Tab 1: "Disb breakup" (branch x day, New / Renewal) ---------- */
function parseBreakup(rows) {
  const titles = [];
  rows.forEach((r, i) => { if (/TEAM\s+LD\s+REPORT/i.test(T(r[1]))) titles.push(i); });
  if (!titles.length) throw new Error('Could not find "… TEAM LD REPORT" – check the tab name / link.');
  const t0 = titles[0], typeRow = rows[t0], dateRow = rows[t0 + 1] || [];
  // pairs of columns: New / Renewal per day
  let cols = [], totalCol = -1;
  for (let c = 7; c < typeRow.length; c++) {
    const lab = T(typeRow[c]).toUpperCase();
    if (/^TOTAL/.test(lab)) { totalCol = c; break; }
    if (lab === 'NEW' || lab === 'RENEWAL') cols.push({ c, type: lab === 'NEW' ? 'new' : 'ren', ds: T(dateRow[c]) });
  }
  const dates = resolveDates(cols.map(x => x.ds));
  const dayMap = new Map(), days = [];
  cols.forEach((x, i) => {
    const key = dates[i] || ('X-' + (x.ds || 'spare').toLowerCase());
    if (!dayMap.has(key)) { const d = { key, date: dates[i], spare: !dates[i], label: x.ds || 'Spare', idx: days.length, cols: {} }; dayMap.set(key, d); days.push(d); }
    dayMap.get(key).cols[x.type] = x.c;
  });
  const teams = [];
  titles.forEach((t, ti) => {
    const end = ti + 1 < titles.length ? titles[ti + 1] : rows.length;
    let h = -1;
    for (let i = t; i < Math.min(t + 6, end); i++) if (/^S\.?\s*NO/i.test(T(rows[i][1]))) { h = i; break; }
    if (h < 0) return;
    const body = [];
    for (let i = h + 1; i < end; i++) {
      const r = rows[i].slice();
      if (/^TOTAL$/i.test(T(r[2])) || /GRAND/i.test(T(r[2]))) break;
      if (!T(r[5])) { if (body.length && !T(r[1])) break; continue; }
      body.push(r);
    }
    fillDown(body, [2, 3, 4]);
    const team = { name: teamLabel(rows[t][1]), rows: [] };
    body.forEach(r => {
      const n = days.length, o = { nf: Array(n).fill(0), na: Array(n).fill(0), rf: Array(n).fill(0), ra: Array(n).fill(0) };
      days.forEach(d => {
        if (d.cols.new != null) { o.nf[d.idx] = num(r[d.cols.new]); o.na[d.idx] = num(r[d.cols.new + 1]); }
        if (d.cols.ren != null) { o.rf[d.idx] = num(r[d.cols.ren]); o.ra[d.idx] = num(r[d.cols.ren + 1]); }
      });
      team.rows.push({
        team: team.name, areaLabel: titleCase(r[2]).replace(/\s*-\s*/, ' ').replace(/^Area (\d)/, 'Area $1'),
        manager: prettyName(r[3]), cluster: prettyName(r[4]), branch: prettyName(r[5]), fos: num(r[6]), ...o
      });
    });
    teams.push(team);
  });
  // Drop spare slots that are empty
  const keep = days.filter(d => !d.spare || teams.some(t => t.rows.some(r => r.nf[d.idx] || r.na[d.idx] || r.rf[d.idx] || r.ra[d.idx])));
  const remap = keep.map(d => d.idx);
  teams.forEach(t => t.rows.forEach(r => { ['nf', 'na', 'rf', 'ra'].forEach(k => r[k] = remap.map(i => r[k][i])); }));
  keep.forEach((d, i) => d.idx = i);
  // month history (rows like "April month")
  const history = [];
  if (totalCol >= 0) {
    for (let i = titles[titles.length - 1]; i < rows.length; i++) {
      const r = rows[i];
      for (let c = totalCol; c < r.length; c++) {
        const m = T(r[c]).match(/^([A-Za-z]+)\s+month$/i);
        if (m) {
          const e = { month: titleCase(m[1]), nf: num(r[totalCol]), na: num(r[totalCol + 1]), rf: num(r[totalCol + 2]), ra: num(r[totalCol + 3]) };
          if (e.na + e.ra > 0) history.push(e);
        }
      }
    }
  }
  return { days: keep, teams, history };
}

/* ---------- Tab 2: "Entity wise" (date x entity) ---------- */
function parseEntity(rows) {
  let hr = rows.findIndex(r => r.some(c => /GRAND\s*TOTAL/i.test(T(c))) && r.some(c => /FINVESCO|SRIKARA/i.test(T(c))));
  if (hr < 0) throw new Error('Could not find the entity header row (Finvesco / Srikara …).');
  const starts = [];
  rows[hr].forEach((c, i) => { if (i > 0 && T(c)) starts.push({ i, name: T(c) }); });
  const ents = starts.filter(s => !/GRAND/i.test(s.name)).map(s => ({ name: prettyName(s.name.replace(/_/g, ' ')), c: s.i }));
  const grand = starts.find(s => /GRAND/i.test(s.name));
  const dstr = [], rr = [];
  for (let i = hr + 1; i < rows.length; i++) {
    if (/^TOTAL/i.test(T(rows[i][0]))) break;
    if (rawDate(rows[i][0])) { dstr.push(T(rows[i][0])); rr.push(rows[i]); }
  }
  const keys = resolveDates(dstr);
  const out = { dates: keys, entities: ents.map(e => ({ name: e.name, nf: [], na: [], rf: [], ra: [] })), grand: { f: [], a: [] } };
  rr.forEach(r => {
    ents.forEach((e, k) => { out.entities[k].nf.push(num(r[e.c])); out.entities[k].na.push(num(r[e.c + 1])); out.entities[k].rf.push(num(r[e.c + 2])); out.entities[k].ra.push(num(r[e.c + 3])); });
    out.grand.f.push(grand ? num(r[grand.i]) : 0); out.grand.a.push(grand ? num(r[grand.i + 1]) : 0);
  });
  return out;
}

/* ---------- Tab 3: "Com vs Achi" (commitment vs achievement) ---------- */
function parseCvA(rows) {
  const titles = [];
  rows.forEach((r, i) => { if (/\bTEAM\b/i.test(T(r[1])) && !/COMMITMENT/i.test(T(r[1]))) titles.push(i); });
  if (!titles.length) throw new Error('Could not find the team blocks (SKYLAB TEAM / RK TEAM).');
  // blocks (one per day) – found on the first team's title row
  const t0 = titles[0], r0 = rows[t0], h0 = rows[t0 + 1] || [];
  const starts = [], ds = [];
  for (let c = 7; c < r0.length; c++) {
    if ((rawDate(r0[c]) || /^SPARE$/i.test(T(r0[c]))) && /ASSES+MENT/i.test(T(h0[c]))) { starts.push(c); ds.push(T(r0[c])); }
  }
  const keys = resolveDates(ds);
  const blocks = starts.map((c, i) => ({ c, key: keys[i], spare: !keys[i] })).filter(b => !b.spare);
  const teams = titles.map((t, ti) => {
    const end = ti + 1 < titles.length ? titles[ti + 1] : rows.length;
    const body = [];
    let started = false;
    for (let i = t + 2; i < end; i++) {
      const r = rows[i].slice();
      if (/^\d+$/.test(T(r[1]))) { started = true; body.push(r); }
      else if (started) break;
    }
    fillDown(body, [2, 3]);
    return {
      name: teamLabel(rows[t][1]),
      rows: body.map(r => ({
        area: titleCase(r[2]).replace(/\s*-\s*/, ' ').replace(/^Area (\d)/, 'Area $1'), cluster: prettyName(r[3]), branch: prettyName(r[4]), fos: num(r[5]),
        d: blocks.map(b => ({ as: num(r[b.c]), cr: num(r[b.c + 1]), cn: num(r[b.c + 2]), ca: num(r[b.c + 3]), af: num(r[b.c + 4]), aa: num(r[b.c + 5]) }))
      }))
    };
  });
  return { dates: blocks.map(b => b.key), teams };
}

/* ---------- Tab 4: "Daily commitment" (customer draft files) ---------- */
function parseDrafts(rows) {
  const titles = [];
  rows.forEach((r, i) => { if (/\bTEAM\b/i.test(T(r[1])) && !/COMMITMENT/i.test(T(r[1]))) titles.push(i); });
  if (!titles.length) throw new Error('Could not find the team blocks.');
  const t0 = titles[0], r0 = rows[t0];
  const starts = [], ds = [];
  for (let c = 7; c < r0.length; c++) if (rawDate(r0[c])) { starts.push(c); ds.push(T(r0[c])); }
  const keys = resolveDates(ds);
  const byDate = {};
  starts.forEach((c, bi) => {
    const key = keys[bi]; if (!key) return;
    const dc = c + 5; // "BRANCH NAME" column
    const teams = [];
    titles.forEach((t, ti) => {
      const end = ti + 1 < titles.length ? titles[ti + 1] : rows.length;
      const items = []; let total = null;
      for (let i = t + 2; i < end; i++) {
        const nm = T(rows[i][dc]); if (!nm || (i !== t + 2 && /^(grand\s*)?total$/i.test(nm))) continue;
        const e = { branch: prettyName(nm), files: num(rows[i][dc + 1]), amt: num(rows[i][dc + 2]) };
        if (i === t + 2) total = e; else items.push(e);
      }
      if (!total) total = { files: items.reduce((a, b) => a + b.files, 0), amt: items.reduce((a, b) => a + b.amt, 0) };
      teams.push({ team: teamLabel(rows[t][1]), files: total.files, amt: total.amt, items });
    });
    byDate[key] = teams;
  });
  return byDate;
}

/* ---------- Tab 5: "Hierarchy" (Team > Area > Cluster > Branch, with heads and designations) ---------- */
function parseHierarchy(rows) {
  const h = rows.findIndex(r => r.some(c => /^branch$/i.test(T(c))) && r.some(c => /^team$/i.test(T(c))));
  if (h < 0) throw new Error('Could not find the header row (Team, Area, … Branch). Please use the template.');
  const hdr = rows[h].map(c => T(c).toLowerCase().replace(/\s+/g, ' '));
  const col = (...res) => hdr.findIndex(x => res.some(re => re.test(x)));
  const C = { order: col(/^(order|#|s\.?\s?no)$/), team: col(/^team$/), area: col(/^area$/), areaMgr: col(/^area (manager|head)$/), areaDesig: col(/^area (manager|head) designation$/),
    cluster: col(/^cluster$/), clusterHead: col(/^cluster (head|manager)$/), clusterDesig: col(/^cluster (head|manager) designation$/),
    branch: col(/^branch$/), branchMgr: col(/^branch (manager|head)$/), branchDesig: col(/^branch (manager|head) designation$/), fos: col(/^fos( count)?$/) };
  const g = (r, k) => (C[k] >= 0 ? T(r[C[k]]) : '');
  const out = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i]; if (!g(r, 'branch')) continue;
    out.push({ ord: C.order >= 0 && g(r, 'order') !== '' ? num(r[C.order]) : null, i, team: g(r, 'team'), area: g(r, 'area'), areaMgr: g(r, 'areaMgr'), areaDesig: g(r, 'areaDesig') || 'Area Manager',
      cluster: g(r, 'cluster'), clusterHead: g(r, 'clusterHead'), clusterDesig: g(r, 'clusterDesig') || 'Cluster Head', branch: g(r, 'branch'), branchMgr: g(r, 'branchMgr'), branchDesig: g(r, 'branchDesig') || 'Branch Manager', fos: num(g(r, 'fos')) });
  }
  if (!out.length) throw new Error('The Hierarchy tab has no branch rows.');
  if (out.every(x => x.ord != null)) out.sort((a, b) => a.ord - b.ord || a.i - b.i);
  return out;
}
function buildModel(tabs) {
  const m = { errors: {} };
  const run = (k, fn, csv) => { if (csv == null) return null; try { return fn(parseCSV(csv)); } catch (e) { m.errors[k] = e.message || String(e); return null; } };
  m.breakup = run('breakup', parseBreakup, tabs.breakup);
  m.entity = run('entity', parseEntity, tabs.entity);
  m.cva = run('cva', parseCvA, tabs.cva);
  m.drafts = run('daily', parseDrafts, tabs.daily);
  m.hier = run('hier', parseHierarchy, tabs.hier);
  return m;
}

/* ===== column chart (stacked or grouped, hover + keyboard) ===== */
function niceTicks(max, n) {
  const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const top = Math.ceil(max / step) * step, ticks = [];
  for (let v = 0; v <= top + step / 2; v += step) ticks.push(+v.toFixed(6));
  return { ticks, top: top || 1 };
}
const tickAmt = v => v === 0 ? '0' : v >= 1e7 ? +(v / 1e7).toFixed(2) + ' Cr' : v >= 1e5 ? +(v / 1e5).toFixed(2) + ' L' : v >= 1e3 ? +(v / 1e3).toFixed(1) + 'K' : String(v);
const tickCnt = v => String(v);
function barPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h));
  if (h <= 0) return '';
  if (r === 0) return `M${x},${y + h}V${y}H${x + w}V${y + h}Z`;
  return `M${x},${y + h}V${y + r}a${r},${r} 0 0 1 ${r},${-r}H${x + w - r}a${r},${r} 0 0 1 ${r},${r}V${y + h}Z`;
}
function columnChart(el, o) {
  const W = Math.max(el.clientWidth || 640, 260), H = o.height || 280, m = { l: 50, r: 6, t: 14, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.cats.length, stacked = o.mode !== 'group';
  if (!n) { el.innerHTML = '<div class="empty">No data yet</div>'; return; }
  const totals = o.cats.map((_, i) => stacked ? sum(o.series.map(s => s.values[i])) : Math.max(...o.series.map(s => s.values[i])));
  const { ticks, top } = niceTicks(Math.max(...totals, o.ref ? o.ref.value : 0, 1), 4);
  const y = v => m.t + ih - (v / top) * ih, band = iw / n;
  const bw = Math.min(o.maxBar || 40, band * (stacked ? .68 : .76)), tf = o.yFmt || tickAmt;
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.label || 'chart')}">`;
  ticks.forEach(t => { s += `<line class="${t === 0 ? 'ax' : 'gl'}" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${tf(t)}</text>`; });
  const every = band < 15 ? 3 : band < 24 ? 2 : 1;
  o.cats.forEach((c, i) => { if (i % every === 0) s += `<text x="${m.l + band * i + band / 2}" y="${H - 8}" text-anchor="middle">${esc(c.label)}</text>`; });
  s += `<rect class="hl" id="hl" x="0" y="${m.t}" width="${band}" height="${ih}" rx="4"/>`;
  o.cats.forEach((c, i) => {
    const op = o.dim && o.dim[i] ? .4 : 1, cx = m.l + band * i + band / 2;
    if (stacked) {
      let acc = 0; const nz = o.series.map(x => x.values[i] > 0);
      const topIdx = nz.lastIndexOf(true);
      o.series.forEach((se, k) => {
        const v = se.values[i]; if (v <= 0) return;
        const y1 = y(acc + v), y0 = y(acc), hh = y0 - y1;
        s += `<path d="${barPath(cx - bw / 2, y1, bw, hh, k === topIdx ? 7 : 0)}" fill="${se.color}" stroke="var(--surface)" stroke-width="${acc > 0 ? 1 : 0}" opacity="${op}"/>`;
        acc += v;
      });
    } else {
      const gw = bw / o.series.length;
      o.series.forEach((se, k) => {
        const v = se.values[i]; if (v <= 0) return;
        s += `<path d="${barPath(cx - bw / 2 + k * gw + 1, y(v), gw - 2, y(0) - y(v), 5)}" fill="${se.color}" opacity="${op}"/>`;
      });
    }
  });
  if (o.ref) s += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${y(o.ref.value)}" y2="${y(o.ref.value)}"/><text x="${m.l + 6}" y="${y(o.ref.value) - 5}" text-anchor="start">${esc(o.ref.label)}</text>`;
  o.cats.forEach((c, i) => { s += `<rect class="hit" tabindex="0" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" aria-label="${esc(o.tip(i).title + ': ' + o.tip(i).rows.map(r => r.name + ' ' + r.value).join(', '))}"/>`; });
  s += '</svg>';
  el.innerHTML = s;
  const hl = $('#hl', el);
  const on = (i, ev, rect) => { hl.setAttribute('x', m.l + band * i); hl.style.opacity = 1; const r = rect.getBoundingClientRect(); showTip(el, ev ? ev.clientX : r.left + r.width / 2, ev ? ev.clientY : r.top + 40, o.tip(i)); };
  $$('.hit', el).forEach(r => {
    const i = +r.dataset.i;
    r.addEventListener('pointermove', e => on(i, e, r)); r.addEventListener('pointerenter', e => on(i, e, r));
    r.addEventListener('focus', () => on(i, null, r));
    ['pointerleave', 'blur'].forEach(ev => r.addEventListener(ev, () => { hl.style.opacity = 0; hideTip(); }));
  });
}

/* ===== BRANCHES (hierarchy: Team > Area > Cluster > Branch, same order as the Excel) ===== */
function buildTree(items) {
  const teams = [];
  const get = (arr, key, mk) => { let n = arr.find(x => x.key === key); if (!n) { n = mk(); arr.push(n); } return n; };
  items.forEach(x => {
    const r = x.r;
    const t = get(teams, r.team, () => ({ key: r.team, level: 0, label: r.team + ' team', kids: [] }));
    const ak = r.team + '|' + r.manager + '|' + r.areaLabel;
    const a = get(t.kids, ak, () => ({ key: ak, level: 1, label: r.areaLabel + ' · ' + r.manager, who: r.manager === '—' ? '' : (r.mgrDesig || 'Area Manager'), kids: [] }));
    const ck = ak + '|' + r.cluster;
    const c = get(a.kids, ck, () => ({ key: ck, level: 2, label: (r.cluster || '—') + ' cluster', who: r.clusterHead ? (r.clusterDesig || 'Cluster Head') + ': ' + r.clusterHead : '', kids: [] }));
    c.kids.push({ key: ck + '|' + r.branch, level: 3, label: r.branch, leaf: x, who: r.branchMgr ? (r.branchDesig || 'Branch Manager') + ': ' + r.branchMgr : '', kids: [] });
  });
  const roll = n => {
    if (n.leaf) { const l = n.leaf; Object.assign(n, { nf: l.nf, na: l.na, rf: l.rf, ra: l.ra, fos: l.r.fos, br: 1 }); }
    else { n.kids.forEach(roll); ['nf', 'na', 'rf', 'ra', 'fos', 'br'].forEach(k => n[k] = sum(n.kids.map(c => c[k]))); }
    n.tf = n.nf + n.rf; n.ta = n.na + n.ra; return n;
  };
  return teams.map(roll);
}

async function readUploadFile(e) {

    const all = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    if (!all.length) throw new Error('The file is empty.');
    const head = all[0].map(h => String(h).toLowerCase().replace(/\s+/g, ' ').trim());
    const need = ['entity_code', 'branch', 'disbursed_date', 'loan type'];
    const miss = need.filter(n => !head.includes(n));
    if (miss.length) throw new Error('This does not look like the daily disbursement file. Missing column(s): ' + miss.join(', ') + '.');
    if (head.indexOf('branch') !== 6 || head.indexOf('disbursed_date') !== 18) throw new Error('The columns are not in the usual order (Branch should be column G and Disbursed_date column S). Please use the standard daily export.');

    for (let i = 0; i < UP.rows.length; i += N) {
      info.textContent = `Uploading… ${Math.min(i + N, UP.rows.length)} of ${UP.rows.length} rows`;
      const out = await api('upload', { rows: UP.rows.slice(i, i + N) });
      if (!out.ok) throw new Error(out.error || 'Upload failed.');
      added += out.added; skipped += out.skipped;
    }
    info.innerHTML = `<span class="chip good"><span aria-hidden="true">✓</span> Done</span> ${fmtN(added)} new rows added${skipped ? ', ' + fmtN(skipped) + ' already existed and were skipped' : ''}. The new numbers show after you press Refresh.`;
    UP.rows = [];
  } catch (err) {
    if (err.auth) { UP.busy = false; return; }
    info.innerHTML = '<span class="chip crit"><span aria-hidden="true">✕</span> ' + esc(err.message === 'Failed to fetch' ? 'Could not reach the upload service.' : err.message) + '</span>' + (added ? ` ${fmtN(added)} rows were added before the problem. Uploading the same file again is safe.` : '');
    go.disabled = false;
  }
  UP.busy = false;
}

/* ===== Download icons: loan-wise export on the number cards, table export on the other cards ===== */
const DL_SVG = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v8m0 0L4.8 6.8M8 10l3.2-3.2M2.5 13h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function xlCell(v) { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function saveCsv(name, rows) {
  const blob = new Blob(['﻿' + rows.map(r => r.map(xlCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name.replace(/[^\w\-]+/g, '_') + '.csv'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
/* what each number card stands for */
function kpiSpec(label) {
  const D = derive(); if (D.last < 0) return null;
  const keys = D.rangeIdx.map(i => D.days[i].key).sort(), lastKey = D.days[D.last].key, t = D.tot;
  const period = ST.range === 'last' ? dShort(lastKey) : ST.range === 'last7' ? 'Last 7 working days' : ST.range === 'custom' ? (ST.from ? dShort(ST.from) : 'start') + ' – ' + (ST.to ? dShort(ST.to) : 'latest') : 'Month to date';
  const base = { from: keys[0], to: keys[keys.length - 1], branches: ST.team === 'All' ? [] : D.rows.map(r => r.branch), team: ST.team, period, name: 'loans' };
  if (/^New/.test(label)) return { ...base, type: 'New', title: 'New loans', expect: t.nf, name: 'new_loans' };
  if (/^Renewal/.test(label)) return { ...base, type: 'Renewal', title: 'Renewal loans', expect: t.rf, name: 'renewal_loans' };
  if (/^Latest day/.test(label)) return { ...base, from: lastKey, to: lastKey, period: dShort(lastKey), type: '', title: 'Loans on the latest day', expect: D.dayTot[D.last].nf + D.dayTot[D.last].rf, name: 'latest_day_loans' };
  return { ...base, type: '', title: 'All loans', expect: t.tf, name: 'all_loans' };
}
function openLoanExport(label) {
  const sp = kpiSpec(label); if (!sp) return;
  $('#setupBody').innerHTML = `<button class="btn x" id="sx">✕ Close</button><h3>Download ${esc(sp.title.toLowerCase())}</h3>
  <p class="note">One row per loan, with employee, branch, customer, account number, date, amounts, product and loan type. Aadhaar, bank and nominee details are not included.</p>
  <div class="tabstat" style="margin:10px 0"><span>Period</span><span>${esc(sp.period)}</span><span>Team</span><span>${esc(sp.team === 'All' ? 'All teams' : sp.team)}</span><span>Loan type</span><span>${sp.type || 'New and Renewal'}</span><span>Files on the card</span><span>${fmtN(sp.expect)}</span></div>
  ${CONFIG.API_URL ? '' : '<div class="banner err" style="margin:10px 0"><span><b>Not set up.</b> This needs the service address in <code>CONFIG.API_URL</code>.</span></div>'}
  <div id="dlInfo" class="note" aria-live="polite"></div><div style="margin-top:14px"><button class="btn primary" id="dlGo" type="button">⬇ Download CSV</button></div>`;
  $('#setup').classList.add('on'); $('#sx').onclick = () => $('#setup').classList.remove('on');
  $('#dlGo').onclick = async () => {
    const info = $('#dlInfo'), go = $('#dlGo');
    go.disabled = true; info.textContent = 'Getting the loans from your sheet…';
    try {
      const out = await api('export', { from: sp.from, to: sp.to, type: sp.type, branches: sp.branches }); if (!out.ok) throw new Error(out.error || 'Download failed.');
      saveCsv(`${sp.name}_${sp.from}_to_${sp.to}`, [out.header, ...out.rows]);
      const n = out.rows.length, diff = n !== sp.expect;
      info.innerHTML = `<span class="chip good"><span aria-hidden="true">✓</span> Downloaded</span> ${fmtN(n)} loans.` + (diff ? ` <span class="chip warn">The card shows ${fmtN(sp.expect)} files.</span> The numbers can differ if a branch is missing from the Hierarchy tab or the Settings month does not match these dates.` : ' This matches the card.');
    } catch (err) { if (err.auth) return; info.innerHTML = '<span class="chip crit"><span aria-hidden="true">✕</span> ' + esc(err.message === 'Failed to fetch' ? 'Could not reach the service. If you just updated the script, deploy a New version.' : err.message) + '</span>'; }
    go.disabled = false;
  };
}
/* other cards: download what the card shows */
function exportCard(card) {
  const title = ((card.querySelector('h2') || {}).textContent || 'table').trim();
  const day = card.querySelector('#c-days, #t-days');
  let rows;
  if (day) {
    const D = derive();
    rows = [['Date', 'New files', 'New amount', 'Renewal files', 'Renewal amount', 'Total files', 'Total amount']];
    D.chartIdx.forEach(i => { const x = D.dayTot[i]; if (x.nf + x.rf + x.na + x.ra > 0) rows.push([D.days[i].key, x.nf, x.na, x.rf, x.ra, x.nf + x.rf, x.na + x.ra]); });
  } else {
    const tb = card.querySelector('table'); if (!tb) return;
    rows = [...tb.querySelectorAll('tr')].map(tr => [...tr.children].map(c => c.innerText.replace(/\s+/g, ' ').trim()));
  }
  saveCsv(title, rows);
}
function decorate() {
  document.querySelectorAll('#view .kpi:not([data-dl])').forEach(k => {
    k.dataset.dl = 1; const l = ((k.querySelector('.l') || {}).textContent || '').trim();
    const b = document.createElement('button'); b.type = 'button'; b.className = 'dl'; b.title = 'Download the loans behind this number'; b.setAttribute('aria-label', 'Download loans: ' + l); b.innerHTML = DL_SVG;
    b.onclick = () => openLoanExport(l); k.appendChild(b);
  });
  document.querySelectorAll('#view section.card .card-h:not([data-dl])').forEach(h => {
    const card = h.closest('section.card'); if (!card || !(card.querySelector('table') || card.querySelector('#c-days, #t-days'))) return;
    h.dataset.dl = 1; const b = document.createElement('button'); b.type = 'button'; b.className = 'dl inl'; b.title = 'Download this table as CSV'; b.setAttribute('aria-label', 'Download this table as CSV'); b.innerHTML = DL_SVG;
    b.onclick = () => exportCard(card); h.appendChild(b);
  });
}
new MutationObserver(() => { clearTimeout(decorate.t); decorate.t = setTimeout(decorate, 30); }).observe(document.getElementById('view'), { childList: true, subtree: true });

/* ===== PARAMETERS PAGE: edit the hierarchy (areas, clusters, branches, heads, designations) ===== */
const DESIGS = ['Area Manager', 'Regional Manager', 'Zonal Manager', 'Cluster Head', 'Cluster Manager', 'Branch Manager', 'Branch Head', 'Team Leader', 'FOS Lead'];
const HIER_HEAD = ['Order', 'Team', 'Area', 'Area Manager', 'Area Manager Designation', 'Cluster', 'Cluster Head', 'Cluster Head Designation', 'Branch', 'Branch Manager', 'Branch Manager Designation', 'FOS'];
const DRAFT_KEY = 'dash-hierarchy-draft';

function flatToNested(rows) {
  const T = [];
  rows.forEach(h => {
    let t = T.find(x => x.name === h.team); if (!t) { t = { name: h.team, areas: [] }; T.push(t); }
    let a = t.areas.find(x => x.name === h.area && x.mgr === (h.areaMgr || '')); if (!a) { a = { name: h.area, mgr: h.areaMgr || '', desig: h.areaDesig || 'Area Manager', clusters: [] }; t.areas.push(a); }
    let c = a.clusters.find(x => x.name === h.cluster); if (!c) { c = { name: h.cluster, head: h.clusterHead || '', desig: h.clusterDesig || 'Cluster Head', branches: [] }; a.clusters.push(c); }
    if (h.branch) c.branches.push({ name: h.branch, mgr: h.branchMgr || '', desig: h.branchDesig || 'Branch Manager', fos: h.fos || 0 });
  });
  return T;
}
function nestedToFlat(d) {
  const out = [];
  d.forEach(t => t.areas.forEach(a => a.clusters.forEach(c => c.branches.forEach(b => {
    if (!String(b.name).trim()) return;
    out.push({ team: t.name, area: a.name, areaMgr: a.mgr, areaDesig: a.desig, cluster: c.name, clusterHead: c.head, clusterDesig: c.desig, branch: b.name, branchMgr: b.mgr, branchDesig: b.desig, fos: +b.fos || 0 });
  }))));
  return out;
}
function savedFlat() {
  if (MODEL.hier) return MODEL.hier.map(x => ({ ...x }));
  return MODEL.breakup.teams.flatMap(t => t.rows).map(r => ({ team: r.team, area: r.areaLabel, areaMgr: r.manager, areaDesig: 'Area Manager', cluster: r.cluster, clusterHead: '', clusterDesig: 'Cluster Head', branch: r.branch, branchMgr: '', branchDesig: 'Branch Manager', fos: r.fos }));
}
const flatToRows = f => f.map((r, i) => [i + 1, r.team, r.area, r.areaMgr, r.areaDesig, r.cluster, r.clusterHead, r.clusterDesig, r.branch, r.branchMgr, r.branchDesig, r.fos]);
const csvCell = v => { v = String(v == null ? '' : v); return /[",\n\t]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function persistDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(ST.draft)); } catch (e) { } }
function pathNode(path) {
  const p = path.split('/').map(Number); let n = ST.draft[p[0]];
  if (p.length > 1) n = n.areas[p[1]]; if (p.length > 2) n = n.clusters[p[2]]; if (p.length > 3) n = n.branches[p[3]];
  return n;
}
function pathParent(path) {
  const p = path.split('/').map(Number), last = p.pop();
  let list = ST.draft;
  if (p.length === 1) list = ST.draft[p[0]].areas; else if (p.length === 2) list = ST.draft[p[0]].areas[p[1]].clusters; else if (p.length === 3) list = ST.draft[p[0]].areas[p[1]].clusters[p[2]].branches;
  return { list, idx: last };
}
function copyText(txt) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
  return new Promise((res, rej) => { const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = 0; document.body.appendChild(t); t.select(); try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); } t.remove(); });
}

function renderParams(root) {
  if (!ST.draft) {
    let d = null; try { const s = localStorage.getItem(DRAFT_KEY); if (s) { d = JSON.parse(s); ST.draftRestored = true; } } catch (e) { }
    ST.draft = d || flatToNested(savedFlat());
  }
  const D = ST.draft, rawRows = MODEL.breakup.teams.flatMap(t => t.rows), dataKeys = new Set(rawRows.map(r => norm(r.branch)));
  const cnt = { t: D.length, a: 0, c: 0, b: 0 }, seen = {}, dup = new Set();
  D.forEach(t => t.areas.forEach(a => { cnt.a++; a.clusters.forEach(c => { cnt.c++; c.branches.forEach(b => { cnt.b++; const k = norm(b.name); if (seen[k]) dup.add(k); seen[k] = 1; }); }); }));
  const unmapped = rawRows.filter(r => !seen[norm(r.branch)]);
  const clusterOpts = []; D.forEach((t, ti) => t.areas.forEach((a, ai) => a.clusters.forEach((c, ci) => clusterOpts.push([`${ti}/${ai}/${ci}`, `${t.name} › ${a.name} › ${c.name}`]))));
  const inp = (path, f, v, ph, cls = '') => `<input class="pin ${cls}" data-p="${path}" data-f="${f}" value="${esc(v)}" placeholder="${esc(ph || '')}" aria-label="${esc(ph || f)}">`;
  const desig = (path, v, ph) => `<input class="pin" list="desigs" data-p="${path}" data-f="desig" value="${esc(v)}" placeholder="${esc(ph)}" aria-label="Designation">`;
  const tools = (path, kids) => `<span class="ptools"><button class="ib" data-act="up" data-p="${path}" title="Move up" aria-label="Move up">↑</button><button class="ib" data-act="down" data-p="${path}" title="Move down" aria-label="Move down">↓</button><button class="ib del" data-act="del" data-p="${path}" title="Delete" aria-label="Delete">${ST.confirmDel === path ? 'Click again to delete' : '✕'}</button></span>`;
  const html = D.map((t, ti) => `<section class="card pteam"><div class="prow ph"><span class="plab">Team</span>${inp(ti, 'name', t.name, 'Team name', 'w-md')}${tools(String(ti))}</div>
    ${t.areas.map((a, ai) => { const ap = `${ti}/${ai}`; return `<div class="parea"><div class="prow"><span class="plab">Area</span>${inp(ap, 'name', a.name, 'Area (e.g. Area 1)', 'w-sm')}<span class="plab">Head</span>${inp(ap, 'mgr', a.mgr, 'Area manager name', 'w-md')}<span class="plab">Designation</span>${desig(ap, a.desig, 'Designation')}${tools(ap)}</div>
      ${a.clusters.map((c, ci) => { const cp = `${ap}/${ci}`; return `<div class="pclus"><div class="prow"><span class="plab">Cluster</span>${inp(cp, 'name', c.name, 'Cluster name', 'w-md')}<span class="plab">Head</span>${inp(cp, 'head', c.head, 'Cluster head name', 'w-md')}<span class="plab">Designation</span>${desig(cp, c.desig, 'Designation')}${tools(cp)}</div>
        ${c.branches.map((b, bi) => { const bp = `${cp}/${bi}`, k = norm(b.name); return `<div class="prow pbr"><span class="plab">Branch</span>${inp(bp, 'name', b.name, 'Branch name', 'w-md' + (dup.has(k) ? ' bad' : ''))}<span class="plab">Manager</span>${inp(bp, 'mgr', b.mgr, 'Branch manager name', 'w-md')}<span class="plab">Designation</span>${desig(bp, b.desig, 'Designation')}<span class="plab">FOS</span><input class="pin w-xs" type="number" min="0" data-p="${bp}" data-f="fos" value="${esc(b.fos)}" aria-label="FOS count">
          <select class="pin" data-act="move" data-p="${bp}" aria-label="Move branch to another cluster"><option value="">Move to…</option>${clusterOpts.filter(o => o[0] !== cp).map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select>${tools(bp)}
          ${dup.has(k) ? '<span class="chip crit"><span aria-hidden="true">✕</span> Duplicate</span>' : (b.name && !dataKeys.has(k) ? '<span class="chip mute" title="No disbursement rows found for this name in your Disb breakup tab">New / no data yet</span>' : '')}</div>`; }).join('')}
        <div class="prow"><button class="btn sm" data-act="add-branch" data-p="${cp}">+ Add branch</button></div></div>`; }).join('')}
      <div class="prow"><button class="btn sm" data-act="add-cluster" data-p="${ap}">+ Add cluster</button></div></div>`; }).join('')}
    <div class="prow"><button class="btn sm" data-act="add-area" data-p="${ti}">+ Add area</button></div></section>`).join('');
  const sheetState = MODEL.hier ? '<span class="chip good"><span aria-hidden="true">✓</span> Reading your Hierarchy tab</span>' : (CONFIG.URLS.hier ? `<span class="chip crit"><span aria-hidden="true">✕</span> Hierarchy tab not readable${MODEL.errors.hier ? ': ' + esc(MODEL.errors.hier) : ''}</span>` : '<span class="chip warn"><span aria-hidden="true">▲</span> No Hierarchy tab connected yet – showing the structure found in your Excel</span>');
  root.innerHTML = `<datalist id="desigs">${DESIGS.map(d => `<option value="${esc(d)}">`).join('')}</datalist>
  <section class="card" style="margin-top:14px"><div class="card-h"><div><h2>Parameters · hierarchy</h2><div class="sub">Change area, cluster and branch names, who heads each one, their designation, FOS counts, and move branches between clusters. Order here is the order used everywhere in the dashboard.</div></div><div class="ctl">${sheetState}</div></div>
    <div class="facts" style="margin-bottom:12px"><span><b>${cnt.t}</b> teams</span><span><b>${cnt.a}</b> areas</span><span><b>${cnt.c}</b> clusters</span><span><b>${cnt.b}</b> branches</span></div>
    ${ST.draftRestored ? '<div class="note" style="margin-bottom:10px">Your unsaved edits from last time were restored.</div>' : ''}
    ${dup.size ? `<div class="chip crit" style="margin-bottom:10px"><span aria-hidden="true">✕</span> ${dup.size} branch name${dup.size > 1 ? 's are' : ' is'} used twice – only the first one counts.</div>` : ''}
    ${unmapped.length ? `<div class="warnbox"><b>${unmapped.length} branch${unmapped.length > 1 ? 'es have' : ' has'} disbursements but ${unmapped.length > 1 ? 'are' : 'is'} not in this hierarchy.</b> Add ${unmapped.length > 1 ? 'them' : 'it'} so ${unmapped.length > 1 ? 'they appear' : 'it appears'} in the right area:<div class="chips" style="margin-top:8px">${unmapped.map(r => `<button class="chip warn adopt" data-act="adopt" data-n="${esc(r.branch)}" data-team="${esc(r.team)}">+ ${esc(r.branch)}</button>`).join('')}</div></div>` : ''}
    <div class="pact"><button class="btn primary" id="pCopy">Copy rows for Google Sheet</button><button class="btn" id="pCsv">Download CSV</button><button class="btn" id="pPrev">Preview in dashboard</button><button class="btn" id="pReset">Reset edits</button><span class="note" id="pMsg" role="status"></span></div>
    <ol class="steps" style="margin-top:12px"><li>Make your changes below.</li><li>Press <b>Preview in dashboard</b> to see them in the Branches and Overview screens straight away (only on this screen).</li><li>To save them for everyone: press <b>Copy rows for Google Sheet</b>, open the <code>Hierarchy</code> tab, click cell <code>A1</code> and paste. The dashboard picks it up within a few minutes.</li></ol></section>${html}
  <div class="prow" style="margin-top:14px"><button class="btn" data-act="add-team">+ Add team</button></div>`;
  const msg = t => { const m = $('#pMsg', root); if (m) m.textContent = t; };
  const flat = () => nestedToFlat(ST.draft);
  // text edits (no re-render, so typing keeps focus)
  $$('input[data-f]', root).forEach(i => i.addEventListener('input', () => { const n = pathNode(i.dataset.p), f = i.dataset.f; n[f] = f === 'fos' ? +i.value || 0 : i.value; persistDraft(); ST.confirmDel = null; }));
  const rerender = () => { const y = window.scrollY; renderParams($('#view')); window.scrollTo(0, y); };
  $$('[data-act]', root).forEach(el => {
    const act = el.dataset.act, p = el.dataset.p;
    const run = () => {
      if (act === 'move') { if (!el.value) return; const br = pathNode(p), src = pathParent(p); src.list.splice(src.idx, 1); const q = el.value.split('/').map(Number); ST.draft[q[0]].areas[q[1]].clusters[q[2]].branches.push(br); }
      else if (act === 'up' || act === 'down') { const { list, idx } = pathParent(p), j = idx + (act === 'up' ? -1 : 1); if (j < 0 || j >= list.length) return; [list[idx], list[j]] = [list[j], list[idx]]; }
      else if (act === 'del') { if (ST.confirmDel !== p) { ST.confirmDel = p; rerender(); return; } const { list, idx } = pathParent(p); list.splice(idx, 1); ST.confirmDel = null; }
      else if (act === 'add-branch') pathNode(p).branches.push({ name: '', mgr: '', desig: 'Branch Manager', fos: 0 });
      else if (act === 'add-cluster') pathNode(p).clusters.push({ name: 'New cluster', head: '', desig: 'Cluster Head', branches: [{ name: '', mgr: '', desig: 'Branch Manager', fos: 0 }] });
      else if (act === 'add-area') pathNode(p).areas.push({ name: 'New area', mgr: '', desig: 'Area Manager', clusters: [{ name: 'New cluster', head: '', desig: 'Cluster Head', branches: [{ name: '', mgr: '', desig: 'Branch Manager', fos: 0 }] }] });
      else if (act === 'add-team') ST.draft.push({ name: 'New team', areas: [{ name: 'New area', mgr: '', desig: 'Area Manager', clusters: [{ name: 'New cluster', head: '', desig: 'Cluster Head', branches: [{ name: '', mgr: '', desig: 'Branch Manager', fos: 0 }] }] }] });
      else if (act === 'adopt') {
        const team = el.dataset.team; let t = ST.draft.find(x => x.name === team); if (!t) { t = { name: team, areas: [] }; ST.draft.push(t); }
        let a = t.areas.find(x => x.name === 'Unassigned'); if (!a) { a = { name: 'Unassigned', mgr: '', desig: 'Area Manager', clusters: [] }; t.areas.push(a); }
        let c = a.clusters[0]; if (!c) { c = { name: 'Unassigned', head: '', desig: 'Cluster Head', branches: [] }; a.clusters.push(c); }
        const raw = rawRows.find(r => r.branch === el.dataset.n); c.branches.push({ name: el.dataset.n, mgr: '', desig: 'Branch Manager', fos: raw ? raw.fos : 0 });
      }
      if (act !== 'del') ST.confirmDel = null; persistDraft(); rerender();
    };
    el.addEventListener(act === 'move' ? 'change' : 'click', run);
  });
  $('#pCopy', root).onclick = () => { const rows = [HIER_HEAD, ...flatToRows(flat())]; copyText(rows.map(r => r.map(csvCell).join('\t')).join('\n')).then(() => msg('Copied ✓ – now paste into cell A1 of the Hierarchy tab.'), () => msg('Could not copy – use Download CSV instead.')); };
  $('#pCsv', root).onclick = () => { const rows = [HIER_HEAD, ...flatToRows(flat())]; const blob = new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Hierarchy.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); msg('Downloaded Hierarchy.csv – in Google Sheets use File ▸ Import ▸ Replace current sheet.'); };
  $('#pPrev', root).onclick = () => { ST.previewRows = flat(); renderHeader(); msg('Previewing – open Overview or Branches to see it.'); };
  $('#pReset', root).onclick = () => { ST.draft = flatToNested(savedFlat()); ST.draftRestored = false; ST.previewRows = null; try { localStorage.removeItem(DRAFT_KEY); } catch (e) { } renderHeader(); rerender(); };
}
